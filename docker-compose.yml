# PostgreSQL local para desenvolvimento: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: localizaae
    ports:
      - "5432:5432"
    volumes:
      - localizaae-pgdata:/var/lib/postgresql/data
volumes:
  localizaae-pgdata:
